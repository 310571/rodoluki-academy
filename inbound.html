<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodoluki Academy | Inbound</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1A2B56; --accent: #252d8f; --light: #5FC9FF; --bg: #F8FAFC; --danger: #e11d48; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: #1e293b; overflow-x: hidden; }

        /* LOGIN */
        #authWrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 5000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: white; padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .auth-logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 20px; }
        .auth-logo span { color: var(--light); }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; outline: none; }
        .btn-login { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* NAVBAR */
        .nav-bar { background: var(--primary); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-right { display: flex; gap: 20px; align-items: center; }
        .btn-exit-site { background: rgba(255,255,255,0.1); color: white; border: 1px solid white; padding: 8px 15px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: 0.3s; }
        .btn-exit-site:hover { background: white; color: var(--primary); }

        /* HOME CARDS */
        .hero { background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); color: white; padding: 60px 20px; text-align: center; }
        .container { max-width: 1100px; margin: -40px auto 50px; padding: 0 20px; }
        .grid-modulos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; }
        .card-main { background: white; padding: 45px 25px; border-radius: 20px; text-align: center; cursor: pointer; box-shadow: 0 10px 15px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #f1f5f9; }
        .card-main:hover { transform: translateY(-10px); border-color: var(--light); }
        .card-main i { font-size: 3.5rem; color: var(--primary); margin-bottom: 20px; display: block; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); z-index: 2000; padding: 20px; backdrop-filter: blur(8px); }
        .modal-content { background: white; width: 100%; max-width: 900px; margin: auto; height: 90vh; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { background: var(--primary); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 30px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; text-align: center; }

        /* CONTEÚDO TÉCNICO */
        .info-box { background: #f8fafc; padding: 25px; border-radius: 16px; border-left: 6px solid var(--primary); text-align: left; width: 100%; margin: 20px 0; }
        .nav-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .btn-nav { background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 12px; cursor: pointer; font-weight: 700; }
        .btn-nav:disabled { background: #e2e8f0; color: #94a3b8; }

        /* BOTÃO VOLTAR PARA CURSOS */
        .btn-home-back { display: inline-flex; align-items: center; gap: 10px; background: #64748b; color: white; padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; margin-top: 15px; transition: 0.2s; }
        .btn-home-back:hover { background: #475569; transform: scale(1.05); }

        /* CLIENTES */
        .secao-operacoes { background: #f1f5f9; padding: 20px; border-radius: 20px; margin-top: auto; }
        .grid-operacoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 10px; }
        .btn-op { background: white; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.8rem; color: var(--primary); }
        .btn-op:hover { background: var(--primary); color: white; }

        .btn-pdf { display: inline-flex; align-items: center; gap: 10px; background: var(--danger); color: white; padding: 14px 24px; border-radius: 12px; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

    <div id="authWrapper">
        <div class="auth-box">
            <div class="auth-logo">RODOLUKI<span>ACADEMY</span></div>
            <input type="text" id="userInput" class="auth-input" placeholder="Usuário">
            <input type="password" id="passInput" class="auth-input" placeholder="Senha">
            <button onclick="fazerLogin()" class="btn-login">ENTRAR NO PORTAL</button>
        </div>
    </div>

    <div id="mainContent" style="display:none;">
        <nav class="nav-bar">
            <div style="color:white; font-weight: 800; font-size: 1.3rem;">RODOLUKI <span style="color:var(--light)">ACADEMY</span></div>
            <div class="nav-right">
                <a href="index.html" class="btn-exit-site"><i class="fas fa-arrow-left"></i> Voltar ao Site Oficial</a>
                <i class="fas fa-power-off" onclick="location.reload()" style="color:white; cursor:pointer;" title="Sair do Portal"></i>
            </div>
        </nav>

        <section class="hero">
            <h1>Manuais de Operação</h1>
            <p>Inbound, Conferência e Fluxos Específicos</p>
        </section>

        <div class="container">
            <div class="grid-modulos">
                <div class="card-main" onclick="abrirModulo('recebimento')">
                    <i class="fas fa-truck-loading"></i>
                    <h3>Recebimento</h3>
                </div>
                <div class="card-main" onclick="abrirModulo('conferencia')">
                    <i class="fas fa-clipboard-check"></i>
                    <h3>Conferência</h3>
                </div>
                <div class="card-main" onclick="abrirModulo('armazenagem')">
                    <i class="fas fa-warehouse"></i>
                    <h3>Armazenagem</h3>
                </div>
                <div class="card-main" onclick="abrirModulo('controle')">
                    <i class="fas fa-barcode"></i>
                    <h3>Controle</h3>
                </div>
            </div>
        </div>
    </div>

    <div id="modalTreinamento" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="tituloModal">PROCEDIMENTO</h2>
                <i class="fas fa-times" onclick="fecharModal()" style="cursor:pointer; font-size: 1.5rem;"></i>
            </div>
            <div class="modal-body">
                
                <div id="areaConteudo"></div>

                <div id="controlesNavegacao" class="nav-controls">
                    <button id="btnPrev" class="btn-nav" onclick="mudarPagina(-1)">Anterior</button>
                    <span id="indicadorPagina" style="font-weight:800; color:var(--primary);">Página 1 de 10</span>
                    <button id="btnNext" class="btn-nav" onclick="mudarPagina(1)">Próximo</button>
                </div>

                <button class="btn-home-back" onclick="fecharModal()">
                    <i class="fas fa-th-large"></i> Ver todos os Cursos
                </button>

                <div class="secao-operacoes">
                    <h4 style="font-size: 0.7rem; color: #64748b; text-transform: uppercase;">Fluxos Específicos</h4>
                    <div class="grid-operacoes" id="gridOperacoes"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fazerLogin() {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;
            if(u === "rodoluki" && p === "123") {
                document.getElementById('authWrapper').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } else { alert("Acesso negado!"); }
        }

        const dadosMacro = {
            "recebimento": [
                { icon: "fa-truck", t: "1. Triagem de Veículos", d: "Verificação da placa e documentos na chegada à portaria." },
                { icon: "fa-file-invoice", t: "2. Conferência de Notas", d: "Validação do XML e Danfe com o pedido de compra (P.O)." },
                { icon: "fa-user-shield", t: "3. Segurança na Doca", d: "Uso obrigatório de calços e EPIs durante a descarga." },
                { icon: "fa-boxes", t: "4. Descarga e Separação", d: "Organização dos itens por SKU e data de validade." },
                { icon: "fa-tablet-alt", t: "5. Login Coletor", d: "Acesso ao WMS para início do processo de bipagem." },
                { icon: "fa-check-double", t: "6. Conferência Cega", d: "Bipagem de 100% da carga para garantir acuracidade." },
                { icon: "fa-tag", t: "7. Etiquetagem LPN", d: "Aplicação da etiqueta de palete na face frontal para leitura." },
                { icon: "fa-exclamation-triangle", t: "8. Registro de Avaria", d: "Segregação e registro fotográfico de itens danificados." },
                { icon: "fa-save", t: "9. Fechamento", d: "Finalização do recebimento para atualização de saldo." },
                { icon: "fa-truck-moving", t: "10. Liberação", d: "Entrega do canhoto assinado e saída segura do motorista." }
            ]
        };

        let moduloAtivo = "";
        let paginaAtual = 0;

        function abrirModulo(mod) {
            moduloAtivo = mod;
            paginaAtual = 0;
            document.getElementById('modalTreinamento').style.display = 'flex';
            document.getElementById('tituloModal').innerText = mod.toUpperCase();
            atualizarTela();
            renderizarClientes();
        }

        function atualizarTela() {
            const lista = dadosMacro[moduloAtivo] || dadosMacro["recebimento"];
            const item = lista[paginaAtual];
            document.getElementById('areaConteudo').innerHTML = `
                <i class="fas ${item.icon}" style="font-size: 4rem; color: var(--primary); margin-bottom: 15px;"></i>
                <h2 style="color:var(--primary); font-size: 2rem;">${item.t}</h2>
                <div class="info-box"><p>${item.d}</p></div>
            `;
            document.getElementById('indicadorPagina').innerText = `Página ${paginaAtual + 1} de 10`;
            document.getElementById('btnPrev').disabled = (paginaAtual === 0);
            document.getElementById('btnNext').disabled = (paginaAtual === 9);
            document.getElementById('controlesNavegacao').style.display = 'flex';
        }

        function mudarPagina(dir) {
            paginaAtual += dir;
            atualizarTela();
        }

        function abrirCliente(cli) {
            document.getElementById('controlesNavegacao').style.display = 'none';
            if(cli === 'Rappi') {
                document.getElementById('areaConteudo').innerHTML = `
                    <h2 style="color:var(--primary);">Fluxo Específico: Rappi</h2>
                    <div class="info-box">
                        <p><strong>1. NF:</strong> Localizada no acrílico da doca.</p>
                        <p><strong>2. Sistema:</strong> Utilizar opção RA-30 Cego.</p>
                        <p><strong>3. P.O:</strong> Consultar rodapé da nota fiscal.</p>
                        <div style="text-align:center; margin-top:20px;">
                            <a href="I.T RECEBIMENTO - PDF.pdf" target="_blank" class="btn-pdf">
                                <i class="fas fa-file-pdf"></i> ABRIR MANUAL PDF COMPLETO
                            </a>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById('areaConteudo').innerHTML = `<h2>Fluxo de ${cli} sob atualização.</h2>`;
            }
        }

        function renderizarClientes() {
            const clientes = ["Rappi", "Dengo", "Tunap", "Savencia", "Rascal", "Lindt", "Hersheys"];
            const grid = document.getElementById('gridOperacoes');
            grid.innerHTML = clientes.map(c => `<div class="btn-op" onclick="abrirCliente('${c}')">${c}</div>`).join('');
        }

        function fecharModal() { 
            document.getElementById('modalTreinamento').style.display = 'none'; 
        }
    </script>
</body>
</html>
